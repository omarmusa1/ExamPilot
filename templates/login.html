{% extends "base.html" %}
{% block title %}Log in - ExamPilot{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Welcome back</h1>
  <p class="subtitle">Log in to continue to your quizzes.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" placeholder="you@example.com" autocomplete="email" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" placeholder="Your password" autocomplete="current-password" required>
    <p><button class="btn" type="submit">Log in</button></p>
  </form>
  <p class="muted small auth-foot">No account? <a href="{{ url_for('register') }}">Sign up</a></p>
</div>
{% endblock %}
